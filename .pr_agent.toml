# Configuración básica de Qodo Merge para proyecto React/Vite
# Este archivo debe estar en la raíz del repositorio

[github_app]
# Habilitar análisis automático en PRs
auto_review = true         # Ejecuta /review automáticamente
auto_describe = true       # Ejecuta /describe automáticamente
auto_improve = false       # Activar después de 1-2 semanas de uso

[pr_description]
# Configuración de descripción automática de PRs
publish_description_as_comment = true
enable_pr_type = true
enable_semantic_files_types = true
final_update_message = true
collapsible_file_list = true

[pr_reviewer]
# Configuración del revisor de código
inline_code_comments = true
num_code_suggestions = 4
require_all_tests_to_pass = false     # Cambiar a true cuando tengas tests
require_focused_review = true
require_estimate_effort_to_review = true

# Instrucciones personalizadas para el proyecto
extra_instructions = """
Este es un proyecto React con Vite y ESLint. 
Por favor enfócate en:
- Buenas prácticas de React (hooks, componentes funcionales)
- Problemas de performance y re-renders innecesarios
- Seguridad en dependencias y vulnerabilidades
- Estructura de código y organización
- No dejar console.log en código de producción
- Optimizaciones de Vite
"""

[pr_code_suggestions]
# Configuración de sugerencias de código
num_code_suggestions = 3
commitable_code_suggestions = true
rank_suggestions = true

[config]
# Modelo de IA a utilizar
model = "gpt-4o-mini"          # Usa menos créditos, suficiente para empezar
fallback_models = ["gpt-4o"]   # Fallback si el primero falla

# Configuración de lenguaje
language = "es"  # Comentarios en español

[custom_labels]
# Labels automáticos basados en archivos modificados (opcional)
# Descomenta si quieres usar labels automáticos
# "Component" = ["src/components/**"]
# "Hook" = ["src/hooks/**"]
# "Config" = ["*.config.js", "*.config.ts"]
# "Style" = ["**/*.css", "**/*.scss"]
